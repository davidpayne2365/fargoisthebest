{% extends "base.html" %}
{% block title %}Scan to order{% endblock %}
{% block body %}
<div class="card" style="text-align:center;max-width:420px;margin:0 auto;background:#fff;color:#111">
  <h2 style="margin:4px 0 0">Scan to order a drink</h2>
  <img src="/qr.png" alt="QR code" style="width:100%;max-width:340px">
  <div style="font-family:monospace">{{ cfg.guest_url }}</div>
</div>
<p class="muted small" style="text-align:center">Print this page, or prop a phone showing it on the bar. For a Wi-Fi join code too, run <code>scripts/make_qr.py</code>.</p>
{% endblock %}

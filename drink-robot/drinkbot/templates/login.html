{% extends "base.html" %}
{% block title %}Bartender login{% endblock %}
{% block body %}
<form method="post" class="card" style="max-width:360px">
  <h2 style="margin-top:0">Bartender</h2>
  <label for="pin">PIN</label>
  <input type="password" id="pin" name="pin" inputmode="numeric" autofocus>
  <div class="error">{{ error or "" }}</div>
  <button class="primary big" type="submit">Log in</button>
</form>
{% endblock %}

# =====================================================================
#  DrinkBot configuration
#  Edit this file to match YOUR bottles, pumps and glasses.
#  Restart the service after changes:  sudo systemctl restart drinkbot
# =====================================================================

bar_name: "Garage Bar"

# Address guests open after scanning the QR code.
# "drinkbot.local" works if the Pi's hostname is "drinkbot" (mDNS).
# If a phone can't resolve it, use the Pi's IP, e.g. http://192.168.1.50:8080
guest_url: "http://drinkbot.local:8080"
port: 8080

# PIN for the bartender + admin screens.  CHANGE THIS.
bartender_pin: "1234"

# ---------------------------------------------------------------------
# How cups are handled
#   glass : bartender puts the suggested glass under the nozzle, taps POUR
#   stack : a stack of identical cups sits under the nozzle; robot fills
#           the top cup; bartender lifts it off when the app says READY
# ---------------------------------------------------------------------
cup_mode: glass

# Only used in stack mode: start the next queued drink automatically as
# soon as the previous one is marked picked up (no POUR tap needed).
auto_pour_in_stack_mode: false

# Cup used in stack mode (must exist in "glasses" below)
stack_cup: solo_16

# ---------------------------------------------------------------------
# Payment.  This is a garage bar — no card processing.
#   none  : free, orders go straight to the queue
#   tab   : bartender approves each order (collect cash / keep a tab)
#   venmo : guest sees a Venmo link with the amount; bartender approves
#           once they see the payment come in
# Any mode except "none" also lets the bartender check ID / cut people off.
# ---------------------------------------------------------------------
payment_mode: tab
venmo_handle: ""          # e.g. "Your-Handle" (no @)
currency_symbol: "$"
strong_surcharge: 1.00

# ---------------------------------------------------------------------
# Safety limits
# ---------------------------------------------------------------------
max_pour_ml: 300              # never pour more than this into one cup
max_simultaneous_pumps: 4     # limits current draw on the 12 V supply
max_pump_seconds: 180         # hard cap for any single pump run
allow_strong: true

# ---------------------------------------------------------------------
# Optional cup-present sensor (IR obstacle module or micro-switch).
# Set gpio to null if you don't have one.
# ---------------------------------------------------------------------
cup_sensor:
  gpio: null          # e.g. 16
  active_low: true    # most IR obstacle modules pull LOW when they see a cup

# ---------------------------------------------------------------------
# Pumps.  gpio = BCM pin number driving that pump's MOSFET/relay input.
# ml_per_sec is a starting guess — run calibration from the Admin page.
# active_low: false for MOSFET modules (recommended), true for most relay boards.
# ---------------------------------------------------------------------
pumps:
  - { id: 1, gpio: 17, ingredient: vodka,          ml_per_sec: 1.6, active_low: false }
  - { id: 2, gpio: 27, ingredient: white_rum,      ml_per_sec: 1.6, active_low: false }
  - { id: 3, gpio: 22, ingredient: tequila,        ml_per_sec: 1.6, active_low: false }
  - { id: 4, gpio: 23, ingredient: triple_sec,     ml_per_sec: 1.6, active_low: false }
  - { id: 5, gpio: 24, ingredient: lime_juice,     ml_per_sec: 1.6, active_low: false }
  - { id: 6, gpio: 25, ingredient: simple_syrup,   ml_per_sec: 1.6, active_low: false }
  - { id: 7, gpio: 12, ingredient: orange_juice,   ml_per_sec: 1.6, active_low: false }
  - { id: 8, gpio: 13, ingredient: cranberry_juice, ml_per_sec: 1.6, active_low: false }

# ---------------------------------------------------------------------
# Ingredients.  alcoholic: true  -> scaled by the Light/Strong option.
# ---------------------------------------------------------------------
ingredients:
  vodka:           { name: Vodka,           alcoholic: true }
  white_rum:       { name: White Rum,       alcoholic: true }
  tequila:         { name: Tequila,         alcoholic: true }
  gin:             { name: Gin,             alcoholic: true }
  triple_sec:      { name: Triple Sec,      alcoholic: true }
  lime_juice:      { name: Lime Juice,      alcoholic: false }
  simple_syrup:    { name: Simple Syrup,    alcoholic: false }
  orange_juice:    { name: Orange Juice,    alcoholic: false }
  cranberry_juice: { name: Cranberry Juice, alcoholic: false }
  pineapple_juice: { name: Pineapple Juice, alcoholic: false }
  tonic:           { name: Tonic Water,     alcoholic: false }

# ---------------------------------------------------------------------
# Glasses.  max_ml = how much liquid the robot may put in (leave room for ice).
# ---------------------------------------------------------------------
glasses:
  rocks:    { name: "Rocks glass",            max_ml: 200 }
  highball: { name: "Highball / tall glass",  max_ml: 300 }
  martini:  { name: "Martini / coupe",        max_ml: 150 }
  solo_16:  { name: "16 oz party cup",        max_ml: 300 }

# ---------------------------------------------------------------------
# Recipes.  Amounts in ml (1 oz ≈ 30 ml).  Drinks only show up on the
# menu when every ingredient is loaded on a pump.
# ---------------------------------------------------------------------
recipes:
  - id: screwdriver
    name: Screwdriver
    description: Vodka and orange juice.
    glass: highball
    price: 5
    ingredients: { vodka: 45, orange_juice: 135 }

  - id: cape_codder
    name: Cape Codder
    description: Vodka and cranberry.
    glass: highball
    price: 5
    ingredients: { vodka: 45, cranberry_juice: 135, lime_juice: 5 }

  - id: madras
    name: Madras
    description: Vodka, cranberry and orange.
    glass: highball
    price: 6
    ingredients: { vodka: 45, cranberry_juice: 90, orange_juice: 45 }

  - id: cosmopolitan
    name: Cosmopolitan
    description: Vodka, triple sec, cranberry, lime.
    glass: martini
    price: 7
    ingredients: { vodka: 40, triple_sec: 15, cranberry_juice: 30, lime_juice: 15 }

  - id: margarita
    name: Margarita
    description: Tequila, triple sec, lime, a touch of syrup.
    glass: rocks
    price: 7
    ingredients: { tequila: 50, triple_sec: 20, lime_juice: 25, simple_syrup: 10 }

  - id: daiquiri
    name: Daiquiri
    description: Rum, lime and syrup. Serve over ice.
    glass: rocks
    price: 6
    ingredients: { white_rum: 60, lime_juice: 25, simple_syrup: 15 }

  - id: rum_punch
    name: Garage Rum Punch
    description: Rum, orange, cranberry, lime.
    glass: highball
    price: 7
    ingredients: { white_rum: 50, orange_juice: 60, cranberry_juice: 60, lime_juice: 10, simple_syrup: 10 }

  - id: kamikaze
    name: Kamikaze
    description: Vodka, triple sec, lime.
    glass: rocks
    price: 6
    ingredients: { vodka: 40, triple_sec: 20, lime_juice: 20 }

  - id: cran_orange_cooler
    name: Cran-Orange Cooler (no alcohol)
    description: Orange, cranberry, lime, syrup.
    glass: highball
    price: 2
    ingredients: { orange_juice: 90, cranberry_juice: 90, lime_juice: 10, simple_syrup: 10 }

  - id: gin_tonic
    name: Gin & Tonic
    description: Hidden until gin and tonic are on pumps.
    glass: highball
    price: 6
    ingredients: { gin: 50, tonic: 150 }

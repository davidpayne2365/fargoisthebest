# =====================================================================
#  DrinkBot configuration
#  Edit this file to match YOUR bottles, pumps and glasses.
#  Restart the service after changes:  sudo systemctl restart drinkbot
# =====================================================================

bar_name: "Garage Bar"

# Address guests open after scanning the QR code.
# "drinkbot.local" works if the Pi's hostname is "drinkbot" (mDNS).
# If a phone can't resolve it, use the Pi's IP, e.g. http://192.168.1.50:8080
guest_url: "http://drinkbot.local:8080"
port: 8080

# PIN for the bartender + admin screens.  CHANGE THIS.
bartender_pin: "1234"

# ---------------------------------------------------------------------
# How cups are handled
#   glass : bartender puts the suggested glass under the nozzle, taps POUR
#   stack : a stack of identical cups sits under the nozzle; robot fills
#           the top cup; bartender lifts it off when the app says READY
# ---------------------------------------------------------------------
cup_mode: glass

# Only used in stack mode: start the next queued drink automatically as
# soon as the previous one is marked picked up (no POUR tap needed).
auto_pour_in_stack_mode: false

# Cup used in stack mode (must exist in "glasses" below)
stack_cup: solo_16

# ---------------------------------------------------------------------
# Payment.  This is a garage bar — no card processing.
#   none  : free, orders go straight to the queue
#   tab   : bartender approves each order (collect cash / keep a tab)
#   venmo : guest sees a Venmo link with the amount; bartender approves
#           once they see the payment come in
# Any mode except "none" also lets the bartender check ID / cut people off.
# ---------------------------------------------------------------------
payment_mode: tab
venmo_handle: ""          # e.g. "Your-Handle" (no @)
currency_symbol: "$"
strong_surcharge: 1.00

# ---------------------------------------------------------------------
# Safety limits
# ---------------------------------------------------------------------
max_pour_ml: 300              # never pour more than this into one cup
max_simultaneous_pumps: 4     # limits current draw on the 12 V supply
max_pump_seconds: 180         # hard cap for any single pump run
allow_strong: true

# ---------------------------------------------------------------------
# What switches the pumps on and off
#   gpio      : Raspberry Pi pins -> MOSFET modules (final build)
#   usb_relay : USB relay board — lets you test real pumps from a LAPTOP
#   mock      : no hardware, simulated pumps
# ---------------------------------------------------------------------
pump_driver: gpio

usb_relay:
  # One entry per 8-relay board. Find yours with:  python -m drinkbot.relaytest
  #   Windows: "COM3"   Mac: "/dev/cu.usbserial-110"   Linux/Pi: "/dev/ttyUSB0"
  ports: ["COM3"]
  baud: 9600
  # Pump N uses relay N (pumps 9-16 go on the 2nd board). Override per pump with  relay: 5

# ---------------------------------------------------------------------
# Optional cup-present sensor (IR obstacle module or micro-switch).
# Set gpio to null if you don't have one.
# ---------------------------------------------------------------------
cup_sensor:
  gpio: null          # e.g. 4
  active_low: true    # most IR obstacle modules pull LOW when they see a cup

# ---------------------------------------------------------------------
# Pumps.  gpio = BCM pin number driving that pump's MOSFET/relay input.
# All 16 pins below stay LOW while the Pi boots, so pumps can't twitch on.
# ml_per_sec is a starting guess — run calibration from the Admin page.
# active_low: false for MOSFET modules (recommended), true for relay boards.
# ---------------------------------------------------------------------
pumps:
  # --- spirits & liqueurs ---
  - { id: 1,  gpio: 17, ingredient: vodka,           ml_per_sec: 1.6, active_low: false }
  - { id: 2,  gpio: 27, ingredient: amaretto,        ml_per_sec: 1.6, active_low: false }
  - { id: 3,  gpio: 22, ingredient: white_rum,       ml_per_sec: 1.6, active_low: false }
  - { id: 4,  gpio: 23, ingredient: spiced_rum,      ml_per_sec: 1.6, active_low: false }
  - { id: 5,  gpio: 24, ingredient: coconut_rum,     ml_per_sec: 1.6, active_low: false }
  - { id: 6,  gpio: 25, ingredient: tequila,         ml_per_sec: 1.6, active_low: false }
  - { id: 7,  gpio: 12, ingredient: whiskey,         ml_per_sec: 1.6, active_low: false }
  - { id: 8,  gpio: 13, ingredient: triple_sec,      ml_per_sec: 1.6, active_low: false }
  - { id: 9,  gpio: 16, ingredient: peach_schnapps,  ml_per_sec: 1.6, active_low: false }
  # --- still mixers ---
  - { id: 10, gpio: 18, ingredient: lime_juice,      ml_per_sec: 1.6, active_low: false }
  - { id: 11, gpio: 19, ingredient: lemon_juice,     ml_per_sec: 1.6, active_low: false }
  - { id: 12, gpio: 20, ingredient: simple_syrup,    ml_per_sec: 1.6, active_low: false }
  - { id: 13, gpio: 21, ingredient: orange_juice,    ml_per_sec: 1.6, active_low: false }
  - { id: 14, gpio: 26, ingredient: cranberry_juice, ml_per_sec: 1.6, active_low: false }
  - { id: 15, gpio: 10, ingredient: pineapple_juice, ml_per_sec: 1.6, active_low: false }
  - { id: 16, gpio: 9,  ingredient: grenadine,       ml_per_sec: 1.6, active_low: false }

# ---------------------------------------------------------------------
# Ingredients.
#   alcoholic: true   -> scaled by the Light/Strong option
#   group: X          -> menu filter tab this spirit puts a drink under
#   hand_pour: true   -> NOT on a pump. Fizzy stuff foams and goes flat in a
#                        pump, so the bartender screen says "top with ~150 ml Cola".
#   in_stock: false   -> hides every drink that needs it (hand-pour items only)
#   color / tint      -> used to draw the drink pictures (tint = how strongly it colors the drink)
# ---------------------------------------------------------------------
ingredients:
  vodka:           { name: Vodka,           alcoholic: true, group: Vodka, color: "#e8eef2", tint: 0.04 }
  gin:             { name: Gin,             alcoholic: true, group: Gin, color: "#e8eef2", tint: 0.04 }   # not on a pump (swapped for amaretto)
  amaretto:        { name: Amaretto,        alcoholic: true, group: Amaretto, color: "#a85a1c", tint: 0.7 }
  white_rum:       { name: White Rum,       alcoholic: true, group: Rum, color: "#efece4", tint: 0.05 }
  spiced_rum:      { name: Spiced Rum,      alcoholic: true, group: Rum, color: "#9a5a2a", tint: 0.6 }
  coconut_rum:     { name: Coconut Rum,     alcoholic: true, group: Rum, color: "#f2efe6", tint: 0.06 }
  tequila:         { name: Tequila,         alcoholic: true, group: Tequila, color: "#efe8cc", tint: 0.08 }
  whiskey:         { name: Whiskey,         alcoholic: true, group: Whiskey, color: "#b8661f", tint: 0.75 }
  triple_sec:      { name: Triple Sec,      alcoholic: true, color: "#f0ead8", tint: 0.05 }
  peach_schnapps:  { name: Peach Schnapps,  alcoholic: true, color: "#f3d9b5", tint: 0.15 }
  lime_juice:      { name: Lime Juice,      alcoholic: false, color: "#cfe0a0", tint: 0.35 }
  lemon_juice:     { name: Lemon Juice,     alcoholic: false, color: "#f1e7a0", tint: 0.35 }
  simple_syrup:    { name: Simple Syrup,    alcoholic: false, color: "#f5f2ea", tint: 0.02 }
  orange_juice:    { name: Orange Juice,    alcoholic: false, color: "#ff9d1c", tint: 1.0 }
  cranberry_juice: { name: Cranberry Juice, alcoholic: false, color: "#b8152f", tint: 1.0 }
  pineapple_juice: { name: Pineapple Juice, alcoholic: false, color: "#f5cf3b", tint: 0.9 }
  grenadine:       { name: Grenadine,       alcoholic: false, color: "#b80f2a", tint: 1.6 }
  # Fizzy mixers — TURNED OFF (in_stock: false) so the robot makes 100% of
  # every drink. Flip any of these to true to bring back the drinks that need
  # them (the bartender then tops the drink up by hand).
  cola:            { name: Cola,             alcoholic: false, hand_pour: true, in_stock: false, color: "#3b1d0e", tint: 1.0 }
  tonic:           { name: Tonic Water,      alcoholic: false, hand_pour: true, in_stock: false, color: "#f1f4f6", tint: 0.03 }
  soda_water:      { name: Soda Water,       alcoholic: false, hand_pour: true, in_stock: false, color: "#f1f4f6", tint: 0.02 }
  ginger_beer:     { name: Ginger Beer,      alcoholic: false, hand_pour: true, in_stock: false, color: "#e9d9a6", tint: 0.4 }
  lemon_lime_soda: { name: Lemon-Lime Soda,  alcoholic: false, hand_pour: true, in_stock: false, color: "#f1f4f6", tint: 0.02 }

# ---------------------------------------------------------------------
# Glasses.  max_ml = total liquid INCLUDING any hand-poured top-up
# (leave room for ice).
# ---------------------------------------------------------------------
glasses:
  rocks:    { name: "Rocks glass",            max_ml: 200 }
  highball: { name: "Highball / tall glass",  max_ml: 300 }
  martini:  { name: "Martini / coupe",        max_ml: 150 }
  mug:      { name: "Copper mug (or highball)", max_ml: 350 }
  solo_16:  { name: "16 oz party cup",        max_ml: 350 }

# ---------------------------------------------------------------------
# Recipes.  Amounts in ml (1 oz ≈ 30 ml).
#   ingredients : poured by the robot
#   top_with    : poured by the bartender after the robot (fizzy stuff)
#   pour_last   : these pumps wait until the others finish (e.g. grenadine
#                 sinks for the "sunrise" look)
#   finish      : extra instruction shown to the bartender
#   garnish     : optional picture garnish (lime, lemon, orange, cherry, pineapple, none)
#                 — otherwise picked automatically from the ingredients
# Drinks only show on the menu when every ingredient is available.
# ---------------------------------------------------------------------
recipes:

# =====================================================================
#  MVP config: laptop + 4-relay USB board + 4 cheap pumps.
#  Everything else (recipes, glasses, PIN...) comes from config.yaml.
#
#  Run:   python -m drinkbot --config config.mvp.yaml
#
#  4 bottles -> 4 drinks: Screwdriver, Madras, Sex on the Beach, Fuzzy Navel
#  (+ a "No alcohol" option on each).
# =====================================================================
extends: config.yaml

pump_driver: usb_relay      # change to "mock" to try it without hardware
usb_relay:
  ports: ["COM3"]           # find yours: python -m drinkbot.relaytest
  baud: 9600

max_simultaneous_pumps: 4   # all 4 at once ≈ 1.5 A on a 12 V 2 A adapter

pumps:   # pump N is wired to relay N
  - { id: 1, gpio: 17, ingredient: vodka,           ml_per_sec: 1.6 }
  - { id: 2, gpio: 27, ingredient: peach_schnapps,  ml_per_sec: 1.6 }
  - { id: 3, gpio: 22, ingredient: orange_juice,    ml_per_sec: 1.6 }
  - { id: 4, gpio: 23, ingredient: cranberry_juice, ml_per_sec: 1.6 }

# Other good 4-bottle sets (swap the ingredients above):
#   whiskey, amaretto, lemon_juice, simple_syrup
#       -> Whiskey Sour, Old Fashioned, Amaretto Sour, Godfather
#   5th pump: lime_juice -> + Vodka Cranberry
